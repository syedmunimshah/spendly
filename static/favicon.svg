<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Spendly">
  <!-- The same ◈ the navbar wears, drawn rather than typed: a font glyph
       would depend on DM Sans being available, and a favicon has no page to
       inherit fonts from. Colours are the accent green and paper from the
       stylesheet's :root, restated here because an SVG loaded as an icon has
       no access to the site's custom properties. -->
